# =============================================================================
# CENTO development environment with hot reload and bind mounts
# -----------------------------------------------------------------------------
# Use this for local development with live code reloading:
#
#     docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# This extends the base docker-compose.yml with development-specific overrides:
# - Uses development targets from Dockerfiles (hot reload enabled)
# - Mounts source code with bind mounts for instant code changes
# - Preserves node_modules inside containers (avoids host/container conflicts)
# - Keeps production database and settings intact
# =============================================================================

services:
  # ---- Development backend with hot reload ----
  backend:
    build:
      target: development  # Use development stage from Dockerfile
    container_name: cento-backend-dev
    environment:
      NODE_ENV: development
      # Enable watch mode for TypeScript compilation
      TS_NODE_TRANSPILE_ONLY: "true"
    volumes:
      # Mount source code for hot reload
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/test:/app/test
      # Preserve container node_modules (don't overwrite with host's)
      - /app/node_modules
    # Override command to ensure development mode runs
    command: npm run start:dev

  # ---- Development frontend with hot reload ----
  frontend:
    build:
      target: development  # Use development stage from Dockerfile
    container_name: cento-frontend-dev
    environment:
      NODE_ENV: development
      # Enable Next.js hot reload
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SKIP_FONT_OPTIMIZATION: true
      # Watch options for better hot reload
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      # Mount entire frontend directory for proper Next.js hot reload
      - ./frontend:/app
      # Preserve container node_modules (don't overwrite with host's)
      - /app/node_modules
      # Preserve .next build directory
      - /app/.next
    # Override command to ensure development mode runs
    command: npm run dev
    # Add watch configuration for better file change detection
    stdin_open: true
    tty: true
