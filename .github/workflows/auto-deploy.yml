name: Auto-Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allows manual trigger

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Deploy Backend via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script_stop: true
        script: |
          # Configuration
          DEPLOY_DIR="${{ secrets.BACKEND_DEPLOY_PATH }}"
          REPO_URL="${{ secrets.REPO_URL }}"
          BRANCH="${{ github.ref_name }}"

          echo "🚀 Starting Backend Deployment..."
          echo "Branch: $BRANCH"
          echo "Deploy Path: $DEPLOY_DIR"

          # Navigate to deployment directory or clone fresh
          if [ -d "$DEPLOY_DIR" ]; then
            echo "📁 Existing deployment found, pulling latest changes..."
            cd "$DEPLOY_DIR"
            git fetch origin
            git checkout $BRANCH
            git pull origin $BRANCH
          else
            echo "📁 Fresh installation..."
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            git clone -b $BRANCH "$REPO_URL" .
          fi

          # Install dependencies
          echo "📦 Installing dependencies..."
          cd backend
          npm ci --production=false

          # Run database migrations
          echo "🗄️ Running database migrations..."
          npx prisma migrate deploy
          npx prisma generate

          # Build backend
          echo "🔨 Building backend..."
          npm run build

          # Install production dependencies
          echo "📦 Installing production dependencies..."
          npm ci --production=only

          # Restart backend service
          echo "🔄 Restarting backend service..."
          pm2 restart cento-backend || pm2 start dist/main.js --name cento-backend
          pm2 save

          echo "✅ Backend deployment completed successfully!"

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Deploy Frontend via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script_stop: true
        script: |
          # Configuration
          DEPLOY_DIR="${{ secrets.FRONTEND_DEPLOY_PATH }}"
          REPO_URL="${{ secrets.REPO_URL }}"
          BRANCH="${{ github.ref_name }}"

          echo "🚀 Starting Frontend Deployment..."
          echo "Branch: $BRANCH"
          echo "Deploy Path: $DEPLOY_DIR"

          # Navigate to deployment directory or clone fresh
          if [ -d "$DEPLOY_DIR" ]; then
            echo "📁 Existing deployment found, pulling latest changes..."
            cd "$DEPLOY_DIR"
            git fetch origin
            git checkout $BRANCH
            git pull origin $BRANCH
          else
            echo "📁 Fresh installation..."
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            git clone -b $BRANCH "$REPO_URL" .
          fi

          # Install dependencies
          echo "📦 Installing dependencies..."
          cd frontend
          npm ci

          # Create production environment file
          echo "🔧 Creating environment file..."
          echo "NEXT_PUBLIC_API_URL=${{ secrets.API_URL }}" > .env.production
          echo "NEXT_PUBLIC_APP_URL=${{ secrets.APP_URL }}" >> .env.production

          # Build frontend
          echo "🔨 Building frontend..."
          npm run build

          # Restart frontend service
          echo "🔄 Restarting frontend service..."
          pm2 restart cento-frontend || pm2 start npm --name cento-frontend -- start
          pm2 save

          echo "✅ Frontend deployment completed successfully!"

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]

    steps:
    - name: Check Backend Health
      run: |
        echo "🔍 Checking backend health..."
        BACKEND_URL="${{ secrets.API_URL }}/health"

        response=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL" || echo "000")

        if [ "$response" = "200" ]; then
          echo "✅ Backend is healthy!"
        else
          echo "⚠️ Backend health check returned: $response"
          echo "This might be normal if the health endpoint requires authentication"
        fi

    - name: Check Frontend Health
      run: |
        echo "🔍 Checking frontend health..."
        FRONTEND_URL="${{ secrets.APP_URL }}"

        response=$(curl -s -o /dev/null -w "%{http_code}" "$FRONTEND_URL" || echo "000")

        if [ "$response" = "200" ] || [ "$response" = "304" ]; then
          echo "✅ Frontend is healthy!"
        else
          echo "⚠️ Frontend health check returned: $response"
        fi

    - name: Deployment Summary
      run: |
        echo "## 🚀 Auto-Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**✅ Deployment completed successfully!**" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📍 Deployed Services:" >> $GITHUB_STEP_SUMMARY
        echo "- **Backend:** ${{ secrets.API_URL }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Frontend:** ${{ secrets.APP_URL }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔗 Links:" >> $GITHUB_STEP_SUMMARY
        echo "- [Admin Dashboard](${{ secrets.APP_URL }})" >> $GITHUB_STEP_SUMMARY
        echo "- [API Documentation](${{ secrets.API_URL }}/docs)" >> $GITHUB_STEP_SUMMARY