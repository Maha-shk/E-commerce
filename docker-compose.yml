# =============================================================================
# CENTO e-commerce — full stack orchestration
# -----------------------------------------------------------------------------
# Start everything (PostgreSQL + backend + frontend) with a single command:
#
#     docker compose up            # foreground, streams logs
#     docker compose up -d --build # rebuild images and run detached
#
# PostgreSQL data is persisted in the named volume `cento_pgdata` (see bottom),
# so your database survives `docker compose down` and container restarts.
# Values below come from the root `.env` file (copy `.env.example` -> `.env`).
# =============================================================================

services:
  # ---- PostgreSQL database -------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cento-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cento_password}
      POSTGRES_DB: ${POSTGRES_DB:-cento}
    ports:
      # Exposed on the host so you can inspect the DB with a GUI if you like.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cento_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cento} -d ${POSTGRES_DB:-cento}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- NestJS backend API --------------------------------------------------
  backend:
    build:
      context: ./backend
      target: runtime
    container_name: cento-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      # Host is the compose service name `postgres`, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-cento}:${POSTGRES_PASSWORD:-cento_password}@postgres:5432/${POSTGRES_DB:-cento}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me-please}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me-please}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # Seed the bootstrap admin + demo data on first boot.
      SEED_ON_START: ${SEED_ON_START:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cento.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      ADMIN_NAME: ${ADMIN_NAME:-Alessandro Cento}
      # SMTP is optional — leave blank to log OTP/reset codes to this container's logs.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-CENTO Admin <no-reply@cento.local>}
    ports:
      - "${BACKEND_PORT:-4000}:4000"

  # ---- Next.js frontend ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        # Baked into the client bundle at build time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    container_name: cento-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  # Local, persistent Postgres storage. Remove with `docker compose down -v`.
  cento_pgdata:
    driver: local
