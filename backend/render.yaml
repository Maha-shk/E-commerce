services:
  # Backend API Service
  - type: web
    name: cento-backend
    runtime: node
    buildCommand: npm run build && npx prisma generate
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: cento-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://your-frontend.vercel.app
      - key: ADMIN_EMAIL
        value: admin@cento.local
      - key: ADMIN_PASSWORD
        generateValue: true

  # PostgreSQL Database
  - type: postgres
    name: cento-db
    databaseName: cento_prod
    user: cento_admin

# Cron job for database backups (optional)
  - type: cron
    name: daily-db-backup
    schedule: "0 2 * * *"  # 2 AM daily
    command: pg_dump $DATABASE_URL > backup.sql
